<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graphisme génératif — playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #f7f6f3;
        --fond-panneau: #ffffff;
        --texte: #16181d;
        --texte-faible: #5d6470;
        --bord: #d9d6cf;
        --accent: #2f4fa8;
        --erreur: #a3232b;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #15171b;
          --fond-panneau: #1d2026;
          --texte: #e8e6e1;
          --texte-faible: #9aa2ae;
          --bord: #343941;
          --accent: #8fa8e8;
          --erreur: #f0888f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--fond);
        color: var(--texte);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--bord);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }

      header p {
        margin: 0;
        color: var(--texte-faible);
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(320px, 2fr) 3fr;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }

      .panneau {
        background: var(--fond-panneau);
        border: 1px solid var(--bord);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }

      .rangee {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      label {
        color: var(--texte-faible);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      input,
      textarea {
        background: var(--fond);
        color: var(--texte);
        border: 1px solid var(--bord);
        border-radius: 4px;
        padding: 6px 8px;
        font-family: var(--mono);
        font-size: 13px;
      }

      input:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      #seed {
        flex: 1 1 10ch;
        min-width: 10ch;
      }

      #params {
        width: 100%;
        min-height: 46vh;
        resize: vertical;
        tab-size: 2;
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
      }

      button {
        background: var(--fond);
        color: var(--texte);
        border: 1px solid var(--bord);
        border-radius: 4px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .pas {
        font-family: var(--mono);
        min-width: 2.4em;
      }

      #messages {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--texte-faible);
        max-height: 22vh;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #messages li {
        padding: 1px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #messages.invalide li {
        color: var(--erreur);
      }

      #apercu {
        border: 1px solid var(--bord);
        border-radius: 4px;
        overflow: hidden;
        line-height: 0;
      }

      #apercu svg {
        display: block;
        width: 100%;
        height: auto;
      }

      #notation {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--texte-faible);
        background: var(--fond);
        border: 1px solid var(--bord);
        border-radius: 4px;
        padding: 8px;
        margin: 0;
        max-height: 30vh;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Graphisme génératif</h1>
      <p>Edit the params, pick a seed, download the result. Served from the built ESM bundle.</p>
    </header>

    <main>
      <section class="panneau">
        <div class="rangee">
          <label for="seed">Seed</label>
          <input id="seed" type="text" spellcheck="false" autocomplete="off" />
          <button id="prec" class="pas" title="Previous seed" aria-label="Previous seed">◀</button>
          <button id="suiv" class="pas" title="Next seed" aria-label="Next seed">▶</button>
          <button id="alea" class="pas" title="Random seed" aria-label="Random seed">⟳</button>
        </div>

        <label for="params">Params</label>
        <textarea id="params" spellcheck="false" autocomplete="off"></textarea>

        <ul id="messages"></ul>

        <div class="rangee">
          <button id="dl-svg">Download SVG</button>
          <button id="dl-json">Download JSON</button>
          <button id="dl-txt">Download notation</button>
        </div>
      </section>

      <section class="panneau">
        <div id="apercu"></div>
        <pre id="notation"></pre>
      </section>
    </main>

    <script type="module">
      import { encode, generate, getPalette, renderSVG, validate } from '../dist/index.js';

      const $ = (id) => document.getElementById(id);
      const champParams = $('params');
      const champSeed = $('seed');
      const messages = $('messages');
      const apercu = $('apercu');
      const zoneNotation = $('notation');
      const boutonTxt = $('dl-txt');

      /** Used when examples/glissement.json cannot be fetched. */
      const DEFAUT = {
        version: 1,
        seed: 'playground-01',
        palette: 'alphabet-6x12',
        champ: { modulesX: 4, modulesY: 4 },
        module: { colonnes: 4, rangees: 4 },
        parcours: { inter: { type: 'rayonnement' }, intra: { type: 'lignes' } },
        unite: { etages: 2 },
        etages: [
          {
            couleur: {
              gamme: { base: 'B' },
              nuance: { base: 3, inter: { mode: 'progression', amplitude: 0.45 } },
            },
          },
          {
            couleur: { gamme: { base: 'B' }, nuance: { base: 10 } },
            forme: {
              type: { base: 'c' },
              grandeur: { base: 21 },
              rotation: { base: 0, inter: { mode: 'progression', amplitude: 0.125 } },
            },
          },
        ],
      };

      // The seed field works like the CLI's --seed: it overrides the params.
      // It is re-synced from the text whenever the params' own seed changes.
      let seedDesParams = null;
      let sorties = { svg: null, json: null, notation: null };

      /** Steps the trailing integer of a seed; a seed without one gains a '-n' suffix. */
      function decaleSeed(seed, delta) {
        const m = /^(.*?)(\d+)$/.exec(seed);
        const prefixe = m ? m[1] : `${seed}-`;
        const chiffres = m ? m[2] : '0';
        const n = Math.max(0, Number.parseInt(chiffres, 10) + delta);
        return prefixe + String(n).padStart(chiffres.length, '0');
      }

      function seedAleatoire() {
        const octets = new Uint8Array(6);
        crypto.getRandomValues(octets);
        return Array.from(octets, (b) => b.toString(16).padStart(2, '0')).join('');
      }

      function affiche(lignes, invalide) {
        messages.classList.toggle('invalide', invalide);
        messages.replaceChildren(
          ...lignes.map((t) => {
            const li = document.createElement('li');
            li.textContent = t;
            return li;
          }),
        );
      }

      function echoue(lignes) {
        affiche(lignes, true);
        for (const b of ['dl-svg', 'dl-json', 'dl-txt']) $(b).disabled = true;
      }

      function rafraichit(depuisTexte) {
        let params;
        try {
          params = JSON.parse(champParams.value);
        } catch (e) {
          echoue([`JSON: ${e.message}`]);
          return;
        }

        const objet = typeof params === 'object' && params !== null;
        if (depuisTexte && objet && params.seed !== seedDesParams) {
          seedDesParams = params.seed;
          if (typeof params.seed === 'string') champSeed.value = params.seed;
        }
        const effectifs = objet ? { ...params, seed: champSeed.value } : params;

        const r = validate(effectifs);
        if (!r.ok) {
          echoue(r.erreurs.map((e) => `${e.chemin || '/'}: ${e.message} [${e.code}]`));
          return;
        }

        let p;
        try {
          p = generate(r.params);
        } catch (e) {
          echoue([e.message]);
          return;
        }

        const palette = p.paletteInline ?? getPalette(p.palette);
        const svg = renderSVG(p, palette, { joint: r.params.unite.joint ?? 0 });
        let notation = null;
        try {
          notation = encode(p);
        } catch {
          notation = null;
        }

        apercu.innerHTML = svg;
        zoneNotation.textContent =
          notation ?? 'the notation cannot carry an inline palette (SPEC 9.2)';
        sorties = { svg, json: `${JSON.stringify(p)}\n`, notation };

        $('dl-svg').disabled = false;
        $('dl-json').disabled = false;
        boutonTxt.disabled = notation === null;

        const d = p.diagnostics;
        affiche(
          [
            `${p.unites.length} unites, ${p.largeur}x${p.hauteur} base units, ` +
              `${d.contrasteCorrections} contrast corrections`,
            ...d.avertissements.map((a) => `warning: ${a}`),
          ],
          false,
        );
      }

      let minuteur = 0;
      function programme(depuisTexte) {
        clearTimeout(minuteur);
        minuteur = setTimeout(() => rafraichit(depuisTexte), 200);
      }

      function telecharge(extension, contenu, type) {
        if (contenu === null) return;
        const nom = `${champSeed.value.replace(/[^A-Za-z0-9._-]/g, '_') || 'sortie'}.${extension}`;
        const url = URL.createObjectURL(new Blob([contenu], { type }));
        const a = document.createElement('a');
        a.href = url;
        a.download = nom;
        a.click();
        URL.revokeObjectURL(url);
      }

      champParams.addEventListener('input', () => programme(true));
      champSeed.addEventListener('input', () => programme(false));
      for (const [id, delta] of [
        ['prec', -1],
        ['suiv', 1],
      ]) {
        $(id).addEventListener('click', () => {
          champSeed.value = decaleSeed(champSeed.value, delta);
          rafraichit(false);
        });
      }
      $('alea').addEventListener('click', () => {
        champSeed.value = seedAleatoire();
        rafraichit(false);
      });

      $('dl-svg').addEventListener('click', () =>
        telecharge('svg', sorties.svg, 'image/svg+xml'),
      );
      $('dl-json').addEventListener('click', () =>
        telecharge('json', sorties.json, 'application/json'),
      );
      boutonTxt.addEventListener('click', () =>
        telecharge('txt', sorties.notation, 'text/plain'),
      );

      async function demarre() {
        let texte;
        try {
          const reponse = await fetch('../examples/glissement.json');
          texte = reponse.ok ? await reponse.text() : null;
        } catch {
          texte = null;
        }
        champParams.value = texte ?? `${JSON.stringify(DEFAUT, null, 2)}\n`;
        rafraichit(true);
      }

      demarre();
    </script>
  </body>
</html>
